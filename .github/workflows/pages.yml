name: Deploy preview to GitHub Pages

# Manual only: run it from the Actions tab when you want a public
# preview URL. Publishes just the site files (not docs/ or media/qa/).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html robots.txt sitemap.xml css js fonts media _site/
          rm -rf _site/media/qa _site/media/originals _site/media/removed _site/media/spare _site/media/staging _site/media/ai-v1 _site/media/ai-src _site/media/stock

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
